name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.13"
  MAX_SAST_FINDINGS: 0
  MAX_SECRET_FINDINGS: 0
  MAX_IAC_FAILS: 0
  MAX_WORKFLOW_ISSUES: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: make test

      - name: Run coverage
        run: make coverage

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run supply chain security tests
        run: pytest tests/unit/test_supply_chain_core.py tests/integration/test_supply_chain_integration.py -v

      - name: Generate SBOM
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          sbom = manager.generate_sbom_from_lockfile(Path('pyproject.toml'), 'ci-test')
          print(f'SBOM: {len(sbom.components)} components')
          "

      - name: Run SAST scan on source
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          findings = manager.scan_source_code(Path('.'))
          high_severity = len([f for f in findings if f.severity in ('high', 'critical')])
          print(f'SAST findings: {len(findings)} (high/critical: {high_severity})')
          for f in findings[:10]:
              print(f'  - {f.finding_type} in {f.file_path}:{f.line_number}')
          "
        continue-on-error: true

      - name: Run secret detection
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          findings = manager.scan_for_secrets(Path('.'))
          print(f'Secret findings: {len(findings)}')
          for f in findings[:10]:
              print(f'  - {f.matcher_name} in {f.file_path}')
          "
        continue-on-error: true

      - name: Run IaC security scan
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          results = manager.scan_infrastructure(Path('.'))
          failed = len([r for r in results if r.status.value == 'fail'])
          print(f'IaC files scanned: {len(results)}, failed: {failed}')
          "

      - name: Check GitHub Actions workflows
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          findings = manager.scan_all_workflows(Path('.'))
          print(f'Workflow security findings: {len(findings)}')
          for f in findings[:10]:
              print(f'  - {f.finding_type}: {f.description}')
          "

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run adversarial security tests
        run: pytest tests/governance/adversarial/ -v --tb=short

      - name: Run authorization denial tests
        run: pytest tests/governance/adversarial/test_adversarial_permissions.py -v

      - name: Run injection prevention tests
        run: pytest tests/governance/adversarial/test_adversarial_security_matrix.py -v --tb=short

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate foundation manifest
        run: |
          we3 validate examples/experiments/foundation.yaml
          we3 run examples/experiments/foundation.yaml --output var/foundation --database-url sqlite:///./var/we3.db --artifact-root var/artifacts
          we3 verify-dossier var/foundation/release_dossier.json

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run API integration tests
        run: pytest tests/integration/test_api.py -v --tb=short

  release:
    # Release workflow - Generates SBOM, provenance, and evidence bundle (TODO 43)
    runs-on: ubuntu-latest
    needs: [supply-chain, security]
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write  # For OIDC token generation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for provenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate release evidence bundle
        run: |
          python -c "
          from pathlib import Path
          import json
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          evidence = manager.generate_release_evidence(
              source_path=Path('.'),
              lockfile_path=Path('pyproject.toml'),
              release_name='${{ github.event.release.tag_name }}',
              source_commit_sha='${{ github.sha }}',
              builder_identity='github-actions[bot]',
          )
          import os
          os.makedirs('dist', exist_ok=True)
          with open('dist/release_evidence.json', 'w') as f:
              json.dump(evidence, f, indent=2)
          print(f'Release evidence generated with {len(evidence[\"sbom\"][\"component_count\"])} components')
          "

      - name: Generate SBOM for release
        run: |
          python -c "
          from pathlib import Path
          import json
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          sbom = manager.generate_sbom_from_lockfile(Path('pyproject.toml'), 'release-${{ github.event.release.tag_name }}')
          spdx = sbom.to_spdx_json()
          with open('dist/sbom-${{ github.sha }}.spdx.json', 'w') as f:
              json.dump(spdx, f, indent=2)
          "

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: dist/sbom-${{ github.sha }}.spdx.json
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: dist/release_evidence.json
          retention-days: 30

  periodic-rescan:
    # Periodic Vulnerability Rescan - Weekly scheduled scans (TODO 43)
    runs-on: ubuntu-latest
    if: false  # Disabled for foundation - enable for production
    schedule:
      - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check for new vulnerabilities
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager
          manager = SupplyChainManager()
          # Full vulnerability scan against current dependencies
          sbom = manager.generate_sbom_from_lockfile(Path('pyproject.toml'), 'weekly-scan')
          findings = manager.scan_for_vulnerabilities(sbom.components)
          decisions = manager.evaluate_vulnerabilities(findings)
          blocked = [d for _, d in decisions if d.value == 'block']
          if blocked:
              print(f'BLOCKED vulnerabilities found: {len(blocked)}')
              # In production, would create GitHub issue
          else:
              print('No new critical vulnerabilities detected')
          "
        continue-on-error: true