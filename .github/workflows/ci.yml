name: CI

on:
  push:
    branches: [main, dev-mid]
  pull_request:
    branches: [main, dev-mid]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PIP_VERSION: "25.0.1"

jobs:
  quality-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
          python -m pip install "build==1.2.1" "twine==6.0.1"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

      - name: Build wheel and source distribution
        run: |
          rm -rf build dist *.egg-info src/*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Record reproducibility inputs
        run: |
          mkdir -p var
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "python_version=$(python --version 2>&1)"
            echo "pip_version=$(python -m pip --version)"
            sha256sum dist/*
          } > var/build-inputs.txt

      - name: Upload tested build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions-${{ github.sha }}
          path: |
            dist/*
            var/build-inputs.txt
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-and-test
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project security tooling
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"

      - name: Repository-native supply-chain scan
        run: python -m wilson_eval3ngine.supply_chain scan-ci --source . --output var/supply_chain_report.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: var/trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Security regression suites
        run: |
          python -m pytest tests/unit/test_supply_chain_core.py -v
          python -m pytest tests/governance/adversarial/test_adversarial_security_matrix.py -v
          python -m pytest tests/governance/test_production_deployment_contract.py -v
          python -m pytest tests/unit/test_gui_secret_transport.py tests/unit/test_gui_ux6.py -v

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            var/supply_chain_report.json
            var/trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

  validate-foundation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-and-test, supply-chain]
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"

      - name: Validate deterministic foundation lane
        run: |
          we3 validate examples/experiments/foundation.yaml
          we3 run examples/experiments/foundation.yaml --output var/foundation --database-url sqlite:///./var/we3.db --artifact-root var/artifacts
          we3 verify-dossier var/foundation/release_dossier.json

  recovery-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-and-test
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install PostgreSQL recovery tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version

      - name: Install backup test dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev,backup]"

      - name: Execute real encrypted backup and PITR exercise
        env:
          WE3_RUN_POSTGRES_RECOVERY_TEST: "1"
        run: |
          python -m pytest tests/integration/test_backup_restore.py -v --basetemp=var/recovery-runtime

      - name: Upload recovery runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-runtime-${{ github.sha }}
          path: var/recovery-runtime
          if-no-files-found: warn
          retention-days: 30

  attest-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-foundation, recovery-runtime]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: python-distributions-${{ github.sha }}
          path: release

      - name: Generate signed build-provenance attestation
        uses: actions/attest-build-provenance@e3fe62ef559997059fe8380e7d2b4c909e2d65f4
        with:
          subject-path: release/dist/*

      - name: Upload attested release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: attested-python-distributions-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 90

  backup-verification:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install PostgreSQL recovery tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client

      - name: Install backup test dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev,backup]"

      - name: Verify backup primitives and real restore behavior
        env:
          WE3_RUN_POSTGRES_RECOVERY_TEST: "1"
        run: |
          python -m pytest tests/unit/test_backup.py tests/unit/test_backup_reconciliation_unit.py -v
          python -m pytest tests/integration/test_backup_restore.py -v --basetemp=var/recovery-runtime

      - name: Upload scheduled recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scheduled-recovery-${{ github.sha }}
          path: var/recovery-runtime
          if-no-files-found: warn
          retention-days: 30
