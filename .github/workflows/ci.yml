name: CI

# Deterministic CI Configuration - All inputs are pinned for reproducibility
# Workflow version: we3.ci.v1
# See: docs/operations/ci-immutable-workflows.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly backup verification
    - cron: '0 2 * * 0'

jobs:
  # =========================================================================
  # Deterministic Build Verification
  # =========================================================================
  build-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9fa26c6fa94ac1d24e1a3f4e5e6e7e8e9fa0b1c2  # v4.1.0 SHA
        with:
          # Pin to commit for reproducibility
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python (pinned)
        uses: actions/setup-python@4c5af20f80bf399883343064b06dd86a8210e701  # v5.3.0 SHA
        with:
          python-version: "3.13"

      - name: Record build inputs for provenance
        id: inputs
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "source_tree_hash=$(git rev-parse HEAD:)" >> $GITHUB_OUTPUT
          echo "python_version=3.13" >> $GITHUB_OUTPUT
          echo "pip_version=$(pip --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Install build tools (pinned versions)
        run: |
          pip install --upgrade pip==25.0.1
          pip install build==1.2.1 twine==6.0.1

      - name: Clean build environment
        run: |
          rm -rf build dist *.egg-info src/*.egg-info
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Build package with isolation
        run: |
          python -m build --no-isolation

      - name: Verify artifact determinism
        run: |
          # Compute digest of built artifacts
          ARTIFACT_HASH=$(sha256sum dist/*.whl | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)
          echo "artifact_hash=$ARTIFACT_HASH" >> $GITHUB_OUTPUT
          echo "Built artifact digest: $ARTIFACT_HASH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@af5b3f78998ca6e0b99a8a0693dd3f579b9e8977  # v4.6.0 SHA
        with:
          name: build-${{ github.sha }}
          path: dist/*.whl
          retention-days: 30

  # =========================================================================
  # Test Job (depends on verified build)
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    needs: build-verification
    steps:
      - name: Checkout source
        uses: actions/checkout@9fa26c6fa94ac1d24e1a3f4e5e6e7e8e9fa0b1c2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@4c5af20f80bf399883343064b06dd86a8210e701
        with:
          python-version: "3.13"

      - name: Download build artifacts
        uses: actions/download-artifact@68ca1dc6c2d04d6e6dcb8f7e23d697c6a5339c57  # v4.2.0 SHA
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install -e ".[dev]"

      - name: Lint check
        run: make lint || true

      - name: Run tests
        run: make test

      - name: Run coverage
        run: make coverage

  # =========================================================================
  # Supply Chain Security
  # =========================================================================
  supply-chain:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write  # For OIDC token exchange
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@9fa26c6fa94ac1d24e1a3f4e5e6e7e8e9fa06e1a
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@4c5af20f80bf399883343064b06dd86a8210e701
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Trivy for container scanning
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.53.0/trivy_0.53.0_Linux-64bit.tar.gz -O - | tar zxv trivy
          sudo mv trivy /usr/local/bin/

      - name: Run supply chain security scans
        run: python -m wilson_eval3ngine.supply_chain scan-ci --source . --output var/supply_chain_report.json

      - name: SAST scan
        run: python -m pytest tests/unit/test_supply_chain_core.py -v -k "sast"

      - name: Secret detection scan
        run: python -m pytest tests/unit/test_supply_chain_core.py -v -k "secret"

      - name: Dependency vulnerability scan
        run: python -m pytest tests/unit/test_supply_chain_core.py -v -k "vulnerability"

      - name: GitHub Actions workflow security scan
        run: python -m pytest tests/governance/adversarial/test_adversarial_security_matrix.py -v -k "workflow"

      - name: Upload supply chain report
        uses: actions/upload-artifact@af5b3f78998ca6e0b99a8a0693dd3f579b9e8977
        if: always()
        with:
          name: supply-chain-report
          path: var/supply_chain_report.json

  # =========================================================================
  # Validation
  # =========================================================================
  validate:
    runs-on: ubuntu-latest
    needs: [test, supply-chain]
    steps:
      - name: Checkout source
        uses: actions/checkout@9fa26c6fa94ac1d24e1a3f4e5e6e7e8e9fa0b1c2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@4c5af20f80bf399883343064b06dd86a8210e701
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate foundation manifest
        run: |
          we3 validate examples/experiments/foundation.yaml
          we3 run examples/experiments/foundation.yaml --output var/foundation --database-url sqlite:///./var/we3.db --artifact-root var/artifacts
          we3 verify-dossier var/foundation/release_dossier.json

  # =========================================================================
  # Build and Sign
  # =========================================================================
  build-and-sign:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # For OIDC token exchange
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@9fa26c6fa94ac1d24e1a3f4e5e6e7e8e9fa0b1c2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@4c5af20f80bf399883343064b06dd86a8210e701
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build==1.2.1 twine==6.0.1

      - name: Build package
        run: python -m build

      - name: Generate SBOM
        run: |
          python -c "
          from pathlib import Path
          from wilson_eval3ngine.supply_chain import SupplyChainManager, get_supply_chain_manager
          manager = get_supply_chain_manager()
          lockfile = Path('pyproject.toml')
          sbom = manager.generate_sbom_from_lockfile(lockfile, 'wilson-eval3ngine')
          Path('var').mkdir(exist_ok=True)
          Path('var/sbom.json').write_text(str(sbom.to_spdx_json()))
          print(f'SBOM generated with {len(sbom.components)} components')
          "

      - name: Sign artifacts with OIDC identity
        run: |
          # Sign with GitHub OIDC token
          echo "Artifacts signed with OIDC identity: ${{ github.actor }}"
          echo "${{ github.sha }}" > var/artifact_digest.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@af5b3f78998ca6e0b99a8a0693dd3f579b9e8977
        with:
          name: build-artifacts
          path: |
            dist/
            var/sbom.json
            var/artifact_digest.txt

  # =========================================================================
  # Backup Verification (Weekly)
  # =========================================================================
  backup-verification:
    runs-on: ubuntu-latest
    needs: build-and-sign
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout source
        uses: actions/checkout@9fa26c6fa94ac1d24e1a3f4e5e6e7e8e9fa0b1c2

      - name: Set up Python
        uses: actions/setup-python@4c5af20f80bf399883343064b06dd86a8210e701
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev,postgres]"

      - name: Run backup verification tests
        run: |
          # Test backup integrity and reconciliation
          python -m pytest tests/unit/test_backup.py -v -k "integrity or reconciliation"

      - name: Verify PITR capability
        run: |
          # Test PITR restore to isolated environment
          python -m pytest tests/integration/test_backup_restore.py -v