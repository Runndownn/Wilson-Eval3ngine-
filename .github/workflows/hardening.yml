name: Hardening validation

on:
  push:
    branches:
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PIP_VERSION: "25.0.1"

jobs:
  focused-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            src/wilson_eval3ngine/api/body_limit.py \
            src/wilson_eval3ngine/api/__init__.py \
            src/wilson_eval3ngine/gui/secret_transport.py \
            src/wilson_eval3ngine/gui/ux_overlay.py

      - name: Run focused security contracts
        run: |
          python -m pytest -q \
            tests/governance/test_production_deployment_contract.py \
            tests/unit/test_gui_secret_transport.py \
            tests/unit/test_gui_ux6.py \
            tests/unit/test_streaming_body_limit.py \
            tests/unit/test_gui_bind_security.py \
            tests/unit/test_gui_egress_policy.py \
            tests/governance/test_ci_security_contract.py

      - name: Validate production Compose contract
        env:
          WE3_POSTGRES_PASSWORD: test-postgres
          WE3_DATABASE_URL: postgresql+psycopg://we3:test-postgres@postgres:5432/we3
          WE3_REDIS_PASSWORD: test-redis
          WE3_REDIS_URL: redis://:test-redis@redis:6379/0
          WE3_GRAFANA_PASSWORD: test-grafana
          WE3_OIDC_ISSUER: https://issuer.invalid
          WE3_OIDC_JWKS_URI: https://issuer.invalid/jwks
          WE3_DOMAIN: example.invalid
          WE3_TLS_EMAIL: security@example.invalid
        run: docker compose -f docker-compose.prod.yml config >/dev/null

      - name: Ensure branch contains no regular secret handoff in active composition
        run: |
          python - <<'PY'
          from wilson_eval3ngine.gui import server
          from wilson_eval3ngine.gui.secret_transport import store_api_key_pipe
          from wilson_eval3ngine.gui.ux_overlay import install_ux_overlay
          from fastapi import FastAPI
          from pathlib import Path
          import tempfile

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / "index.html").write_text("<html><head></head><body></body></html>")
              app = FastAPI()
              install_ux_overlay(app, root)
              assert server.store_api_key_temp_file is store_api_key_pipe
          PY
