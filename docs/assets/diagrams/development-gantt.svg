<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1880" viewBox="0 0 1800 1880" role="img" aria-labelledby="title desc">
  <title id="title">Wilson Eval3ngine evidence-based development timeline</title>
  <desc id="desc">Readable Gantt-style timeline from 14 July through 22 August 2026. Eight major workstreams show evidence-backed implementation windows, milestone dates, and the engineering outcome of each phase.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117}.panel{fill:#111820;stroke:#30363d;stroke-width:2}.head{fill:#161b22}.title{font:700 38px Arial,sans-serif;fill:#f0f6fc}.subtitle{font:400 20px Arial,sans-serif;fill:#9da7b3}.colhead{font:700 19px Arial,sans-serif;fill:#7ee787;letter-spacing:.5px}.phase{font:700 27px Arial,sans-serif;fill:#f0f6fc}.range{font:700 18px Arial,sans-serif;fill:#58a6ff}.detail{font:400 18px Arial,sans-serif;fill:#aab4bf}.outcome{font:400 19px Arial,sans-serif;fill:#d0d7de}.date{font:700 17px Arial,sans-serif;fill:#9da7b3}.small{font:400 16px Arial,sans-serif;fill:#8b949e}.grid{stroke:#26313d;stroke-width:1}.major{stroke:#484f58;stroke-width:2}.today{stroke:#58a6ff;stroke-width:3;stroke-dasharray:10 8}.core{fill:#1f6feb}.evidence{fill:#238636}.governance{fill:#8957e5}.recovery{fill:#d29922}.security{fill:#da3633}.bartext{font:700 16px Arial,sans-serif;fill:#ffffff}.diamond{fill:#f0f6fc;stroke:#0d1117;stroke-width:3}
    </style>
  </defs>

  <rect width="1800" height="1880" rx="30" class="bg"/>
  <text x="900" y="58" text-anchor="middle" class="title">Wilson Eval3ngine — evidence-based build timeline</text>
  <text x="900" y="94" text-anchor="middle" class="subtitle">14 July → 22 August 2026 · commit-supported implementation periods · current milestone v0.2.0</text>

  <rect x="45" y="125" width="1710" height="1660" rx="22" class="panel"/>
  <rect x="45" y="125" width="1710" height="90" rx="22" class="head"/>
  <rect x="45" y="193" width="1710" height="22" class="head"/>

  <text x="85" y="178" class="colhead">WORKSTREAM</text>
  <text x="520" y="178" class="colhead">WHEN THE WORK LANDED</text>
  <text x="1285" y="178" class="colhead">WHAT CHANGED</text>

  <!-- Timeline frame: x 520..1240 maps 40 days, 18 px/day. -->
  <line x1="500" y1="215" x2="500" y2="1685" class="major"/>
  <line x1="1260" y1="215" x2="1260" y2="1685" class="major"/>

  <g>
    <line x1="520" y1="260" x2="520" y2="1685" class="major"/>
    <line x1="592" y1="260" x2="592" y2="1685" class="grid"/>
    <line x1="664" y1="260" x2="664" y2="1685" class="grid"/>
    <line x1="736" y1="260" x2="736" y2="1685" class="grid"/>
    <line x1="808" y1="260" x2="808" y2="1685" class="grid"/>
    <line x1="844" y1="260" x2="844" y2="1685" class="major"/>
    <line x1="916" y1="260" x2="916" y2="1685" class="grid"/>
    <line x1="988" y1="260" x2="988" y2="1685" class="grid"/>
    <line x1="1060" y1="260" x2="1060" y2="1685" class="grid"/>
    <line x1="1132" y1="260" x2="1132" y2="1685" class="grid"/>
    <line x1="1204" y1="260" x2="1204" y2="1685" class="grid"/>
    <line x1="1222" y1="215" x2="1222" y2="1685" class="today"/>
  </g>

  <g text-anchor="middle">
    <text x="520" y="246" class="date">Jul 14</text>
    <text x="592" y="246" class="date">Jul 18</text>
    <text x="664" y="246" class="date">Jul 22</text>
    <text x="736" y="246" class="date">Jul 26</text>
    <text x="808" y="246" class="date">Jul 30</text>
    <text x="844" y="246" class="date">Aug 1</text>
    <text x="916" y="246" class="date">Aug 5</text>
    <text x="988" y="246" class="date">Aug 9</text>
    <text x="1060" y="246" class="date">Aug 13</text>
    <text x="1132" y="246" class="date">Aug 17</text>
    <text x="1204" y="246" class="date">Aug 21</text>
    <text x="1222" y="246" class="date">Aug 22</text>
  </g>

  <!-- horizontal row separators -->
  <g class="grid">
    <line x1="70" y1="420" x2="1730" y2="420"/>
    <line x1="70" y1="605" x2="1730" y2="605"/>
    <line x1="70" y1="790" x2="1730" y2="790"/>
    <line x1="70" y1="975" x2="1730" y2="975"/>
    <line x1="70" y1="1160" x2="1730" y2="1160"/>
    <line x1="70" y1="1345" x2="1730" y2="1345"/>
    <line x1="70" y1="1530" x2="1730" y2="1530"/>
    <line x1="70" y1="1715" x2="1730" y2="1715"/>
  </g>

  <!-- Row 1 -->
  <text x="85" y="310" class="phase">Foundation vertical slice</text>
  <text x="85" y="342" class="range">14–16 July</text>
  <text x="85" y="374" class="detail">Contracts · mock provider · grading</text>
  <text x="85" y="400" class="detail">Wilson intervals · evidence · API/CLI</text>
  <rect x="520" y="320" width="54" height="42" rx="10" class="core"/>
  <text x="547" y="347" text-anchor="middle" class="bartext">0.1</text>
  <text x="1285" y="310" class="outcome">First complete deterministic path from</text>
  <text x="1285" y="340" class="outcome">declared experiment to signed evidence.</text>
  <text x="1285" y="376" class="small">The project starts as an executable measurement contract.</text>
  <path d="M520 298 l10 10 -10 10 -10 -10 z" class="diamond"/>

  <!-- Row 2 -->
  <text x="85" y="495" class="phase">Evaluation platform expansion</text>
  <text x="85" y="527" class="range">15–16 July</text>
  <text x="85" y="559" class="detail">Expectations · hostile data · hosted providers</text>
  <text x="85" y="585" class="detail">scheduler · calibration · telemetry · supply chain</text>
  <rect x="538" y="505" width="36" height="42" rx="10" class="evidence"/>
  <text x="556" y="532" text-anchor="middle" class="bartext">+</text>
  <text x="1285" y="495" class="outcome">The foundation becomes a broader platform:</text>
  <text x="1285" y="525" class="outcome">real adapters, lifecycle, statistics and controls.</text>
  <text x="1285" y="561" class="small">Behavior, reliability and support stay separate.</text>

  <!-- Row 3 -->
  <text x="85" y="680" class="phase">Identity + evidence protection</text>
  <text x="85" y="712" class="range">29 July</text>
  <text x="85" y="744" class="detail">OIDC/MFA · PostgreSQL RLS</text>
  <text x="85" y="770" class="detail">encrypted evidence storage</text>
  <rect x="790" y="690" width="36" height="42" rx="10" class="security"/>
  <text x="808" y="717" text-anchor="middle" class="bartext">29</text>
  <text x="1285" y="680" class="outcome">Project identity and evidence protection become</text>
  <text x="1285" y="710" class="outcome">first-class architectural boundaries.</text>
  <text x="1285" y="746" class="small">Isolation and storage claims now have explicit control paths.</text>
  <path d="M808 668 l10 10 -10 10 -10 -10 z" class="diamond"/>

  <!-- Row 4 -->
  <text x="85" y="865" class="phase">Operator workspace + assurance</text>
  <text x="85" y="897" class="range">31 July–1 August</text>
  <text x="85" y="929" class="detail">five-workspace GUI · charts · reports</text>
  <text x="85" y="955" class="detail">egress · secrets · deployment · private assurance</text>
  <rect x="826" y="875" width="54" height="42" rx="10" class="core"/>
  <rect x="826" y="927" width="72" height="20" rx="8" class="security"/>
  <text x="853" y="902" text-anchor="middle" class="bartext">UI</text>
  <text x="1285" y="865" class="outcome">Human operation and hardened deployment evolve</text>
  <text x="1285" y="895" class="outcome">together instead of as separate add-ons.</text>
  <text x="1285" y="931" class="small">The public/private assurance boundary becomes explicit.</text>
  <path d="M826 853 l10 10 -10 10 -10 -10 z" class="diamond"/>

  <!-- Row 5 -->
  <text x="85" y="1050" class="phase">Governance + dependency hardening</text>
  <text x="85" y="1082" class="range">9 August</text>
  <text x="85" y="1114" class="detail">contribution policy · changelog</text>
  <text x="85" y="1140" class="detail">dependency/security maintenance</text>
  <rect x="970" y="1060" width="36" height="42" rx="10" class="governance"/>
  <text x="988" y="1087" text-anchor="middle" class="bartext">9</text>
  <text x="1285" y="1050" class="outcome">The engineering process gains public maintenance</text>
  <text x="1285" y="1080" class="outcome">and contribution structure around the implementation.</text>
  <text x="1285" y="1116" class="small">Governance becomes part of release quality, not ceremony.</text>

  <!-- Row 6 -->
  <text x="85" y="1235" class="phase">Documentation reconciliation</text>
  <text x="85" y="1267" class="range">21 August</text>
  <text x="85" y="1299" class="detail">current-status authority · archive cleanup</text>
  <text x="85" y="1325" class="detail">public claims aligned to live source</text>
  <rect x="1186" y="1245" width="36" height="42" rx="10" class="evidence"/>
  <text x="1204" y="1272" text-anchor="middle" class="bartext">21</text>
  <text x="1285" y="1235" class="outcome">Historical plans stay preserved while current docs</text>
  <text x="1285" y="1265" class="outcome">are separated from superseded project states.</text>
  <text x="1285" y="1301" class="small">Documentation becomes an evidence boundary of its own.</text>

  <!-- Row 7 -->
  <text x="85" y="1420" class="phase">Recovery + fail-closed consolidation</text>
  <text x="85" y="1452" class="range">22 August</text>
  <text x="85" y="1484" class="detail">encrypted backup · WAL · PITR</text>
  <text x="85" y="1510" class="detail">Redis/OIDC/audit · metric/grader corrections</text>
  <rect x="1222" y="1430" width="18" height="42" rx="8" class="recovery"/>
  <rect x="1222" y="1482" width="18" height="20" rx="8" class="security"/>
  <text x="1285" y="1420" class="outcome">Recovery stops being scaffolding while security and</text>
  <text x="1285" y="1450" class="outcome">measurement semantics are tightened in parallel.</text>
  <text x="1285" y="1486" class="small">Runtime proof is still required for deployment claims.</text>
  <path d="M1222 1408 l10 10 -10 10 -10 -10 z" class="diamond"/>

  <!-- Row 8 -->
  <text x="85" y="1605" class="phase">Repository narrative + v0.2.0</text>
  <text x="85" y="1637" class="range">22 August</text>
  <text x="85" y="1669" class="detail">authoritative README · architecture visuals</text>
  <text x="85" y="1695" class="detail">timeline · version reconciliation</text>
  <rect x="1222" y="1615" width="18" height="42" rx="8" class="core"/>
  <text x="1285" y="1605" class="outcome">The current pre-1.0 milestone is documented as one</text>
  <text x="1285" y="1635" class="outcome">coherent architecture without inventing releases.</text>
  <text x="1285" y="1671" class="small">v0.2.0 describes repository state, not production certification.</text>

  <!-- Legend and evidence note -->
  <rect x="75" y="1745" width="1650" height="100" rx="16" fill="#0f151c" stroke="#30363d"/>
  <rect x="100" y="1774" width="24" height="16" rx="4" class="core"/><text x="138" y="1788" class="small">Core / operator</text>
  <rect x="310" y="1774" width="24" height="16" rx="4" class="security"/><text x="348" y="1788" class="small">Security / assurance</text>
  <rect x="565" y="1774" width="24" height="16" rx="4" class="recovery"/><text x="603" y="1788" class="small">Recovery / operations</text>
  <rect x="825" y="1774" width="24" height="16" rx="4" class="governance"/><text x="863" y="1788" class="small">Governance</text>
  <rect x="1015" y="1774" width="24" height="16" rx="4" class="evidence"/><text x="1053" y="1788" class="small">Evidence / documentation</text>
  <text x="100" y="1822" class="small">Bars show commit-supported implementation windows. Diamonds mark evidence-backed milestones. Short bars mean concentrated bursts—not guessed durations.</text>
</svg>