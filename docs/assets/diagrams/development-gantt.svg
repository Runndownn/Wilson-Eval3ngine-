  <rect x="610" y="350" width="60" height="28" rx="8" class="bar3"/><rect x="1000" y="440" width="30" height="28" rx="8" class="bar4"/>
  <rect x="1060" y="530" width="60" height="28" rx="8" class="bar1"/><rect x="1060" y="620" width="90" height="28" rx="8" class="bar5"/>
  <rect x="1330" y="710" width="30" height="28" rx="8" class="bar3"/><rect x="1690" y="800" width="30" height="28" rx="8" class="bar2"/>
  <rect x="1720" y="890" width="30" height="28" rx="8" class="bar4"/><rect x="1720" y="980" width="30" height="28" rx="8" class="bar5"/>
  <rect x="1720" y="1070" width="30" height="28" rx="8" class="bar2"/><rect x="1720" y="1160" width="30" height="28" rx="8" class="bar1"/>

