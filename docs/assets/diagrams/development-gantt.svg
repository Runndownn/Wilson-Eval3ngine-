    <text x="910" y="135" class="date">Jul 26</text><text x="1030" y="135" class="date">Jul 30</text><text x="1090" y="135" class="date">Aug 1</text>
    <text x="1210" y="135" class="date">Aug 5</text><text x="1330" y="135" class="date">Aug 9</text><text x="1450" y="135" class="date">Aug 13</text>
    <text x="1570" y="135" class="date">Aug 17</text><text x="1690" y="135" class="date">Aug 21</text><text x="1720" y="135" class="date">Aug 22</text>
