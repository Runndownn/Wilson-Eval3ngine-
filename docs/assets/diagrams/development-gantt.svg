    <path d="M1060 513 l10 10 -10 10 -10 -10 z"/><path d="M1090 603 l10 10 -10 10 -10 -10 z"/>
    <path d="M1330 693 l10 10 -10 10 -10 -10 z"/><path d="M1690 783 l10 10 -10 10 -10 -10 z"/>
    <path d="M1720 873 l10 10 -10 10 -10 -10 z"/>
  </g>

  <rect x="90" y="1220" width="22" height="14" rx="4" class="bar1"/><text x="122" y="1232" class="detail">Core/product work</text>
  <rect x="280" y="1220" width="22" height="14" rx="4" class="bar5"/><text x="312" y="1232" class="detail">Security/assurance</text>
  <rect x="485" y="1220" width="22" height="14" rx="4" class="bar4"/><text x="517" y="1232" class="detail">Recovery/operations</text>
  <rect x="700" y="1220" width="22" height="14" rx="4" class="bar3"/><text x="732" y="1232" class="detail">Governance</text>
  <rect x="875" y="1220" width="22" height="14" rx="4" class="bar2"/><text x="907" y="1232" class="detail">Documentation/evidence alignment</text>
  <text x="1760" y="1232" text-anchor="end" class="detail">Dates are derived from commit evidence; single-day bars denote concentrated implementation bursts.</text>
</svg>