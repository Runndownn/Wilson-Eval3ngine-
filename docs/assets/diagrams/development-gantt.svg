<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280" role="img" aria-labelledby="title desc">
  <title id="title">Wilson Eval3ngine development timeline, July 14 through August 22 2026</title>
  <desc id="desc">Evidence-based Gantt chart showing the major implementation eras reconstructed from repository commits and preserved documentation.</desc>
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f0f6fc}.sub{font:400 17px Arial,sans-serif;fill:#8b949e}.date{font:600 14px Arial,sans-serif;fill:#8b949e}.label{font:700 16px Arial,sans-serif;fill:#f0f6fc}.detail{font:400 13px Arial,sans-serif;fill:#8b949e}.grid{stroke:#30363d;stroke-width:1}.major{stroke:#484f58;stroke-width:1.5}.bar1{fill:#1f6feb}.bar2{fill:#238636}.bar3{fill:#8957e5}.bar4{fill:#d29922}.bar5{fill:#da3633}.milestone{fill:#f0f6fc;stroke:#0d1117;stroke-width:2}.today{stroke:#58a6ff;stroke-width:3;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1900" height="1280" rx="28" fill="#0d1117"/>
  <text x="950" y="52" text-anchor="middle" class="title">Wilson Eval3ngine — evidence-based build timeline</text>
  <text x="950" y="82" text-anchor="middle" class="sub">Origin date: 14 July 2026 • Current evidenced state: 22 August 2026 • Bars represent commit-supported implementation periods, not fabricated release dates.</text>

  <rect x="45" y="110" width="1810" height="1090" rx="20" fill="#111820" stroke="#30363d" stroke-width="2"/>
  <line x1="550" y1="145" x2="550" y2="1165" class="major"/>

  <!-- timeline grid: 40 days, 30 px/day, July 14 to August 22 -->
  <g>
    <line x1="550" y1="145" x2="550" y2="1165" class="major"/><line x1="670" y1="145" x2="670" y2="1165" class="grid"/>
    <line x1="790" y1="145" x2="790" y2="1165" class="grid"/><line x1="910" y1="145" x2="910" y2="1165" class="grid"/>
    <line x1="1030" y1="145" x2="1030" y2="1165" class="grid"/><line x1="1090" y1="145" x2="1090" y2="1165" class="major"/>
    <line x1="1210" y1="145" x2="1210" y2="1165" class="grid"/><line x1="1330" y1="145" x2="1330" y2="1165" class="grid"/>
    <line x1="1450" y1="145" x2="1450" y2="1165" class="grid"/><line x1="1570" y1="145" x2="1570" y2="1165" class="grid"/>
    <line x1="1690" y1="145" x2="1690" y2="1165" class="grid"/><line x1="1720" y1="145" x2="1720" y2="1165" class="today"/>
  </g>
