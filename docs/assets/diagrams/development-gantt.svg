  <!-- row separators -->
  <g class="grid">
    <line x1="70" y1="220" x2="1825" y2="220"/><line x1="70" y1="310" x2="1825" y2="310"/><line x1="70" y1="400" x2="1825" y2="400"/>
    <line x1="70" y1="490" x2="1825" y2="490"/><line x1="70" y1="580" x2="1825" y2="580"/><line x1="70" y1="670" x2="1825" y2="670"/>
    <line x1="70" y1="760" x2="1825" y2="760"/><line x1="70" y1="850" x2="1825" y2="850"/><line x1="70" y1="940" x2="1825" y2="940"/>
    <line x1="70" y1="1030" x2="1825" y2="1030"/><line x1="70" y1="1120" x2="1825" y2="1120"/>
  </g>

  <!-- labels -->
  <g>
    <text x="85" y="183" class="label">Foundation framework</text><text x="85" y="205" class="detail">Contracts, mock provider, grading, Wilson intervals, evidence, API/CLI</text>
    <text x="85" y="273" class="label">Expectation + data contracts</text><text x="85" y="295" class="detail">Hostile datasets, expectation compilation, PostgreSQL/schema work</text>
    <text x="85" y="363" class="label">Providers, statistics, lifecycle</text><text x="85" y="385" class="detail">Hosted adapters, scheduler, calibration, retention, supply-chain controls</text>
    <text x="85" y="453" class="label">Identity + evidence protection</text><text x="85" y="475" class="detail">OIDC/MFA, PostgreSQL RLS, encrypted object evidence</text>
    <text x="85" y="543" class="label">GUI + evidence workspace</text><text x="85" y="565" class="detail">Tabbed operator flow, job orchestration, charts, PDFs, model picker</text>
    <text x="85" y="633" class="label">Security + assurance hardening</text><text x="85" y="655" class="detail">Loopback, egress, provenance, secret transport, private assurance</text>
    <text x="85" y="723" class="label">Governance + community</text><text x="85" y="745" class="detail">Contribution policy, changelog, dependency/security hardening</text>
    <text x="85" y="813" class="label">Documentation reconciliation</text><text x="85" y="835" class="detail">Status authority, archived provenance, public docs aligned to live source</text>
    <text x="85" y="903" class="label">Backup / WAL / PITR</text><text x="85" y="925" class="detail">KMS envelope encryption, WAL helpers, signed recovery, recovery CLI</text>
    <text x="85" y="993" class="label">API/security consolidation</text><text x="85" y="1015" class="detail">Redis authority, OIDC revocation, CORS, audit, idempotency, ingress</text>
    <text x="85" y="1083" class="label">Measurement + governance closure</text><text x="85" y="1105" class="detail">Metric math, prompt-family support, judge evidence, provider approvals</text>
    <text x="85" y="1173" class="label">Repository narrative + v0.2.0</text><text x="85" y="1195" class="detail">Authoritative README, architecture visuals, timeline, version reconciliation</text>
  </g>

  <!-- bars: x = 550 + day_index*30 -->
