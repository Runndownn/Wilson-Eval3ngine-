<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">Wilson Eval3ngine system architecture</title><desc id="desc">Layered architecture showing operator interfaces, application services, evaluation engines, providers, evidence, persistence, review, telemetry, and production infrastructure.</desc><rect width="1400" height="700" rx="24" fill="#0d1117"/><text x="700" y="50" text-anchor="middle" fill="#f0f6fc" font-family="Arial" font-size="30" font-weight="700">Wilson Eval3ngine system architecture</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#58a6ff"/></marker></defs><g font-family="Arial" text-anchor="middle"><rect x="70" y="105" width="1260" height="88" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="700" y="137" fill="#f0f6fc" font-size="20" font-weight="700">Operator interfaces</text><text x="700" y="168" fill="#8b949e" font-size="17">Loopback GUI • CLI • REST API</text><rect x="70" y="245" width="1260" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="700" y="280" fill="#f0f6fc" font-size="20" font-weight="700">Application and orchestration</text><text x="700" y="311" fill="#8b949e" font-size="17">experiment lifecycle • contract validation • rendering • provider dispatch • certification orchestration</text><rect x="70" y="400" width="260" height="105" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="200" y="435" fill="#f0f6fc" font-size="18" font-weight="700">Evaluation core</text><text x="200" y="465" fill="#8b949e" font-size="15">expectations • grading</text><text x="200" y="486" fill="#8b949e" font-size="15">metrics • statistics • gates</text><rect x="365" y="400" width="260" height="105" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="495" y="435" fill="#f0f6fc" font-size="18" font-weight="700">Provider boundary</text><text x="495" y="465" fill="#8b949e" font-size="15">mock • Azure OpenAI • Anthropic</text><text x="495" y="486" fill="#8b949e" font-size="15">Ollama • approved CLI adapters</text><rect x="660" y="400" width="260" height="105" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="790" y="435" fill="#f0f6fc" font-size="18" font-weight="700">Evidence and state</text><text x="790" y="465" fill="#8b949e" font-size="15">artifacts • audit • signing</text><text x="790" y="486" fill="#8b949e" font-size="15">SQLite / PostgreSQL • scheduler</text><rect x="955" y="400" width="375" height="105" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="1142" y="435" fill="#f0f6fc" font-size="18" font-weight="700">Governance and operations</text><text x="1142" y="465" fill="#8b949e" font-size="15">review/adjudication • OIDC/project controls</text><text x="1142" y="486" fill="#8b949e" font-size="15">telemetry • backup/recovery • assurance</text><rect x="70" y="570" width="1260" height="80" rx="14" fill="#111820" stroke="#238636" stroke-width="2"/><text x="700" y="602" fill="#7ee787" font-size="20" font-weight="700">Production-oriented deployment boundary</text><text x="700" y="630" fill="#c9d1d9" font-size="16">Caddy ingress • API • PostgreSQL • Redis • Prometheus • Grafana • private runtime configuration and evidence</text><path d="M700 193 V235" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/><path d="M700 345 V385" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/><path d="M200 505 V555" stroke="#238636" stroke-width="2"/><path d="M495 505 V555" stroke="#238636" stroke-width="2"/><path d="M790 505 V555" stroke="#238636" stroke-width="2"/><path d="M1142 505 V555" stroke="#238636" stroke-width="2"/></g></svg>