<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc"><title id="title">Wilson Eval3ngine trust boundaries</title><desc id="desc">Trust-boundary view separating the operator workstation, provider destinations, public production ingress, internal services, and private runtime assurance.</desc><rect width="1400" height="680" rx="24" fill="#0d1117"/><text x="700" y="50" text-anchor="middle" fill="#f0f6fc" font-family="Arial" font-size="30" font-weight="700">Trust boundaries and assurance</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="105" width="390" height="220" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="255" y="142" fill="#58a6ff" font-size="20" font-weight="700">Operator workstation</text><text x="255" y="180" fill="#f0f6fc" font-size="17">loopback-only GUI</text><text x="255" y="210" fill="#8b949e" font-size="15">endpoint/model management</text><text x="255" y="236" fill="#8b949e" font-size="15">jobs • reports • charts • deletion</text><text x="255" y="282" fill="#c9d1d9" font-size="15">Remote use requires a separately</text><text x="255" y="304" fill="#c9d1d9" font-size="15">authenticated TLS proxy.</text><rect x="505" y="105" width="390" height="220" rx="18" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="700" y="142" fill="#d29922" font-size="20" font-weight="700">Provider boundary</text><text x="700" y="180" fill="#f0f6fc" font-size="17">approved hosted / local / CLI models</text><text x="700" y="210" fill="#8b949e" font-size="15">destination policy • redirect controls</text><text x="700" y="236" fill="#8b949e" font-size="15">bounded requests • credential handling</text><text x="700" y="282" fill="#c9d1d9" font-size="15">Private or loopback destinations are</text><text x="700" y="304" fill="#c9d1d9" font-size="15">opt-in and remain policy constrained.</text><rect x="950" y="105" width="390" height="220" rx="18" fill="#161b22" stroke="#238636" stroke-width="2"/><text x="1145" y="142" fill="#7ee787" font-size="20" font-weight="700">Production service boundary</text><text x="1145" y="180" fill="#f0f6fc" font-size="17">Caddy is the intended ingress</text><text x="1145" y="210" fill="#8b949e" font-size="15">API • PostgreSQL • Redis</text><text x="1145" y="236" fill="#8b949e" font-size="15">Prometheus • Grafana stay internal</text><text x="1145" y="282" fill="#c9d1d9" font-size="15">OIDC, secrets, TLS, egress, and</text><text x="1145" y="304" fill="#c9d1d9" font-size="15">runtime validation are deployment inputs.</text><rect x="170" y="410" width="1060" height="185" rx="18" fill="#111820" stroke="#a371f7" stroke-width="2"/><text x="700" y="450" fill="#d2a8ff" font-size="22" font-weight="700">Evidence and assurance boundary</text><text x="700" y="490" fill="#f0f6fc" font-size="17">Public repository evidence: source contracts • tests • sanitized schemas • topology templates • signed artifacts</text><text x="700" y="526" fill="#8b949e" font-size="16">Private runtime evidence: real identities • certificates • secrets • provider allowlists • raw scans • deployment logs</text><text x="700" y="565" fill="#c9d1d9" font-size="16">Repository implementation can establish controls; production approval requires evidence that those controls were exercised in the target environment.</text><path d="M450 215 H495" stroke="#8b949e" stroke-width="3" stroke-dasharray="8 6"/><path d="M895 215 H940" stroke="#8b949e" stroke-width="3" stroke-dasharray="8 6"/><path d="M255 325 V395" stroke="#a371f7" stroke-width="2"/><path d="M700 325 V395" stroke="#a371f7" stroke-width="2"/><path d="M1145 325 V395" stroke="#a371f7" stroke-width="2"/></g></svg>