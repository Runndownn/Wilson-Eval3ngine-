[build-system]
requires = ["setuptools>=75,<76", "wheel==0.47.0", "build==1.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wilson-eval3ngine"
version = "0.1.0"
description = "Metrics-first, evidence-backed evaluation framework for LLM release decisions."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Wilson Eval3ngine contributors"}]
dependencies = [
  "fastapi>=0.128.0,<0.129.0",
  "pydantic>=2.13.0,<3.0.0",
  "SQLAlchemy>=2.0.50,<2.1.0",
  "typer>=0.26.0,<0.27.0",
  "PyYAML>=6.0.3,<7.0.0",
  "uvicorn>=0.48.0,<0.49.0",
  "cryptography>=50.0.0,<51.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "requests>=2.32.0,<3.0.0",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=9,<10",
  "pytest-timeout>=2.3,<3",
  "httpx>=0.28,<0.29",
  "coverage>=7.8,<8",
  "alembic>=1.16,<2",
]
browser = [
  "playwright>=1.50,<2",
]
oidc = [
  "python-jose[cryptography]>=3.3,<4",
  "requests>=2.32,<3",
]
redis = [
  "redis>=5.0,<6",
]
backup = [
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
]
security = [
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "safety>=3.3,<4",
]

[project.scripts]
we3 = "wilson_eval3ngine.cli:app"
we3-backup = "wilson_eval3ngine.backup.cli:app"
we3-gui-start = "wilson_eval3ngine.gui.run_gui:main"
we3-gui-stop = "wilson_eval3ngine.gui.stop_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
markers = [
  "browser: hermetic or authorized browser assurance",
  "runtime: requires an explicitly authorized isolated runtime",
]

[tool.coverage.run]
branch = true
source = ["wilson_eval3ngine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101"]
