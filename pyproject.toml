[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wilson-eval3ngine"
version = "0.1.0"
description = "Metrics-first, evidence-backed evaluation framework for LLM release decisions."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Wilson Eval3ngine contributors"}]
dependencies = [
  "fastapi>=0.128,<0.129",
  "pydantic>=2.13,<3",
  "SQLAlchemy>=2.0.50,<2.1",
  "typer>=0.26,<0.27",
  "PyYAML>=6.0.3,<7",
  "uvicorn>=0.48,<0.49",
  "cryptography>=46,<47",
  "python-jose[cryptography]>=3.3,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<0.29",
  "coverage>=7.8,<8",
]
oidc = [
  "python-jose[cryptography]>=3.3,<4",
  "requests>=2.32,<3",
]

[project.scripts]
we3 = "wilson_eval3ngine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["wilson_eval3ngine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
